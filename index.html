<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سایه سجاد</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #050505; /* مشکی بسیار عمیق */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Tahoma', sans-serif;
    }

    /* پس‌زمینه با حرکت ابرهای نورانی */
    .background-glow {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1a1a1a 0%, #000 70%);
      z-index: 0;
    }

    /* ذرات طلایی متحرک بسیار زیاد */
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.5;
      animation: moveStar linear infinite;
    }

    @keyframes moveStar {
      from { transform: translateY(100vh); }
      to { transform: translateY(-10vh); }
    }

    /* هاله نورانی مرکزی (نماد معنوی) */
    .aura {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(212, 175, 55, 0.2) 0%, transparent 70%);
      border-radius: 50%;
      z-index: 1;
      animation: pulse 4s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.3); opacity: 0.6; }
    }

    /* کادر متن اصلی */
    .main-card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 50px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 0 50px rgba(0, 0, 0, 1), inset 0 0 20px rgba(212, 175, 55, 0.1);
      max-width: 80%;
    }

    /* متن نام امام سجاد به صورت درخشان */
    .imam-title {
      font-size: 35px;
      color: #d4af37;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.8);
      letter-spacing: 3px;
      animation: glowText 3s infinite alternate;
    }

    @keyframes glowText {
      from { text-shadow: 0 0 10px #d4af37; }
      to { text-shadow: 0 0 30px #fff, 0 0 40px #d4af37; }
    }

    .sub-text {
      font-size: 20px;
      color: #ccc;
      line-height: 2;
      margin-top: 20px;
      font-weight: 300;
    }

    .signature {
      margin-top: 40px;
      font-size: 16px;
      color: #d4af37;
      opacity: 0.6;
      letter-spacing: 2px;
    }

    /* المان متحرک کوچک کنار متن */
    .ornament {
      display: inline-block;
      width: 40px;
      height: 2px;
      background: #d4af37;
      vertical-align: middle;
      margin: 0 15px;
      box-shadow: 0 0 10px #d4af37;
    }
  </style>
</head>
<body>

  <div class="background-glow"></div>
  <div class="aura"></div>
  <div id="stars-container"></div>

  <div class="main-card">
    <div class="imam-title">یا سجاد (ع)</div>
    
    <div style="display: flex; align-items: center; justify-content: center;">
      <span class="ornament"></span>
      <span style="color: #d4af37; font-size: 24px;">✨</span>
      <span class="ornament"></span>
    </div>

    <p class="sub-text">
      در میان هیاهوی بی‌پایانِ این دنیا، <br>

گاهی سکوتی سنگین بر دلم می‌نشیند… <br>

اما وقتی به سجده‌های او فکر می‌کنم، <br>

انگار تمام غصه‌ها در آن خلوتِ پنهان، ذوب می‌شوند. <br>

او که با خدا حرف می‌زد، <br>

حالا یاد من هم کرده است… <br>
    </p>

    <div class="signature">— الیکا</div>
  </div>

  <script>
    // ساخت ذرات متحرک (ستاره‌ها)
    const container = document.getElementById('stars-container');
    const starCount = 80; // تعداد ذرات بیشتر برای جلوه بهتر

    for (let i = 0; i < starCount; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      
      // تنظیمات تصادفی برای هر ذره
      const size = Math.random() * 3 + 'px';
      star.style.width = size;
      star.style.height = size;
      star.style.left = Math.random() * 100 + 'vw';
      star.style.top = Math.random() * 100 + 'vh';
      star.style.animationDuration = Math.random() * 5 + 5 + 's';
      star.style.animationDelay = Math.random() * 10 + 's';
      star.style.opacity = Math.random();

      container.appendChild(star);
    }
  </script>

</body>
</html>
